<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aplikasi To-Do List - Modul 5</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="todo-app">
        <h2>Daftar Tugas Saya</h2>
        
        <!-- Form Input Tugas -->
        <form id="todoForm" novalidate>
            <div class="input-section">
                <input type="text" id="taskInput" placeholder="Ketikkan tugas baru Anda...">
                <button type="submit" class="add-btn">Tambah</button>
            </div>
            <div class="error-message" id="inputError">Tugas tidak boleh kosong atau kurang dari 3 karakter!</div>
        </form>

        <!-- Fitur 1: Penghitung Jumlah Tugas (Task Counter) -->
        <div class="task-counter" id="taskCounter">Total: 0 Tugas | Selesai: 0 | Belum Selesai: 0</div>

        <!-- Daftar Tugas -->
        <ul class="todo-list" id="todoList"></ul>

        <!-- Fitur 2: Tombol Bersihkan Tugas Selesai -->
        <button type="button" class="clear-btn" id="clearCompletedBtn">Bersihkan Tugas Selesai</button>
    </div>

    <!-- Fitur 3: Pop-up / Modal Konfirmasi Hapus (Pengganti confirm dialog) -->
    <div class="modal-backdrop" id="confirmModal">
        <div class="modal-box">
            <h3>Konfirmasi Hapus</h3>
            <p>Apakah Anda yakin ingin menghapus tugas ini?</p>
            <div class="modal-actions">
                <button type="button" class="modal-btn modal-cancel" id="cancelDeleteBtn">Batal</button>
                <button type="button" class="modal-btn modal-confirm" id="confirmDeleteBtn">Hapus</button>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
